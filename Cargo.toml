# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "crates/rowplay-core",
    "crates/rowplay-platform",
    "crates/rowplay-viewmodel",
    "crates/rowplay-app",
    "crates/rowplay-fixtures",
]
# Building the Qt app requires a Qt 6.11 installation (qmake on PATH or QMAKE set).
# `cargo build` / `cargo test` at the workspace root therefore default to the
# Qt-free crates; add `-p rowplay-app` (or `--workspace`) when Qt is available.
default-members = [
    "crates/rowplay-core",
    "crates/rowplay-platform",
    "crates/rowplay-viewmodel",
    "crates/rowplay-fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/shenghaoc/rowplay-qt"
authors = ["shenghaoc"]

[workspace.dependencies]
rowplay-core = { path = "crates/rowplay-core", version = "0.1.0" }
rowplay-platform = { path = "crates/rowplay-platform", version = "0.1.0" }
rowplay-viewmodel = { path = "crates/rowplay-viewmodel", version = "0.1.0" }
rowplay-fixtures = { path = "crates/rowplay-fixtures", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: serde_json's default fast float parser returns the
# neighbouring double for a fraction of long literals — measured across the
# committed fixtures: 1709/19007 rig-phase, 1954/19485 motion, 232/1469
# stroke-model, 180/2353 2d, 91/790 grips, 89/1063 equipment, 28/387
# row-phase (4283 total, ~8-12% per corpus). Every float-bearing corpus —
# generated here or exported by Studio — records web-computed doubles at
# full round-trip precision, so the parity tests must parse them exactly.
# This is also a production parsing change: the Concept2 mapper parses API
# responses with this parser. Realistic payloads are unaffected (0 of the 19
# float literals in the Concept2 fixtures are mis-rounded — the error class
# needs ~16+ significant digits), so no shipped value measurably changes;
# what changes is that exactness stops depending on payload shape. The
# sqlite stroke cache is the one store it does change: its computed watts
# and accumulated t/d serialise (ryu) to >=16-digit literals, 68/1147 of
# which mis-round on a cache-shaped set — cache write->read was not
# bit-exact before either, though a 1 ULP drift on cached training values
# is invisible to every consumer (tolerance-based comparisons and display
# formatting). Preferences carries no float fields.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
regex = "1.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Qt Bridges for Rust (public beta). Pinned exactly: the API is still moving.
qtbridge = "=0.2.0"
# Platform services (Phase 3). Each backend is target-gated inside its crate, so
# one declaration covers every target; see docs/decisions/0007-platform-libraries.md.
# ureq: blocking HTTP over rustls. The `cookies`, `json`, `charset` and proxy
# features stay off — the Concept2 client wants none of them.
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }
# keyring 3 has NO default features: without a backend feature it silently uses
# an in-memory mock store, so all three native backends are named explicitly.
keyring = { version = "3.6.3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
# `bundled` compiles SQLite, so Windows needs no system library.
rusqlite = { version = "0.40.2", features = ["bundled"] }
directories = "6.0.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately relax: the ports mirror web/Swift structure.
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Concept2 product names (RowErg, SkiErg, BikeErg) appear in prose everywhere.
doc_markdown = "allow"
similar_names = "allow"
items_after_statements = "allow"
cast_possible_wrap = "allow"
too_many_arguments = "allow"
# The ports keep the web app's exact arithmetic (`(a + b) / 2`, not `midpoint`).
manual_midpoint = "allow"
