# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "crates/rowplay-core",
    "crates/rowplay-fixtures",
]
# Building the Qt app requires a Qt 6.11 installation (qmake on PATH or QMAKE set).
# `cargo build` / `cargo test` at the workspace root therefore default to the
# Qt-free crates; add `-p rowplay-app` (or `--workspace`) when Qt is available.
default-members = ["crates/rowplay-core", "crates/rowplay-fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/shenghaoc/rowplay-qt"
authors = ["shenghaoc"]

[workspace.dependencies]
rowplay-core = { path = "crates/rowplay-core", version = "0.1.0" }
rowplay-fixtures = { path = "crates/rowplay-fixtures", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Qt Bridges for Rust (public beta). Pinned exactly: the API is still moving.
qtbridge = "=0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately relax: the ports mirror web/Swift structure.
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Concept2 product names (RowErg, SkiErg, BikeErg) appear in prose everywhere.
doc_markdown = "allow"
similar_names = "allow"
items_after_statements = "allow"
cast_possible_wrap = "allow"
too_many_arguments = "allow"
# The ports keep the web app's exact arithmetic (`(a + b) / 2`, not `midpoint`).
manual_midpoint = "allow"
