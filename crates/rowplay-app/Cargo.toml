# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "rowplay-app"
description = "rowplay-qt desktop application: Qt Bridges for Rust backend objects, QML shell and Qt Quick 3D replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rowplay-core.workspace = true
rowplay-platform.workspace = true
rowplay-viewmodel.workspace = true
# `serde_json` lets bridge properties carry read-only structured data
# (qt-bridges-notes #4); the viewmodel builds the values.
qtbridge = { workspace = true, features = ["serde_json"] }
# Direct, not through qtbridge's re-export: the desktop identity
# (`QGuiApplication::setDesktopFileName`) is not on qtbridge's `QApp`
# (ADR 0018, qt-bridges-notes #23). Linux only in use; declared for every
# target because the crate already links it everywhere through qtbridge.
cxx-qt-lib.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
# SHA-256 for the vendored-asset hash pin (tests/asset_hashes.rs).
rowplay-fixtures.workspace = true
# The keyboard helper's `file:` URL in the runtime gate
# (tests/qml_runtime_gate.rs).
percent-encoding.workspace = true

[build-dependencies]
# build.rs validates the vendored V3 rig pack against its contract and embeds
# the name -> material-role map (Phase 5a).
rowplay-viewmodel.workspace = true
serde_json.workspace = true

[lints]
workspace = true
