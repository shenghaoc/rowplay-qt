[package]
name = "rowplay-app"
description = "rowplay-qt desktop application: Qt Bridges for Rust backend objects, QML shell and Qt Quick 3D replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rowplay-core.workspace = true
rowplay-platform.workspace = true
rowplay-viewmodel.workspace = true
# `serde_json` lets bridge properties carry read-only structured data
# (qt-bridges-notes #4); the viewmodel builds the values.
qtbridge = { workspace = true, features = ["serde_json"] }
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
# SHA-256 for the vendored-asset hash pin (tests/asset_hashes.rs).
rowplay-fixtures.workspace = true

[lints]
workspace = true
