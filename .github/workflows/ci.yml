# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Qt-free crates (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Secret Service build dependency for keyring (Linux)
        # keyring's sync-secret-service backend links libdbus-1 through
        # libdbus-sys. ROWPLAY_KEYRING_TESTS stays unset: CI has no Secret
        # Service, so those tests skip and only the in-memory store is used.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p rowplay-core -p rowplay-platform -p rowplay-viewmodel -p rowplay-fixtures --all-targets -- -D warnings
      - name: Test
        run: cargo test -p rowplay-core -p rowplay-platform -p rowplay-viewmodel -p rowplay-fixtures
      - name: Whitespace and conflict markers (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
      - name: Whitespace and conflict markers (push)
        if: github.event_name == 'push'
        run: git diff --check HEAD~1 HEAD

  msrv:
    name: MSRV 1.87 (Qt-free crates)
    runs-on: ubuntu-24.04
    env:
      # Overrides rust-toolchain.toml, which pins the newer CI toolchain.
      RUSTUP_TOOLCHAIN: 1.87.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: Secret Service build dependency for keyring (Linux)
        # keyring's sync-secret-service backend links libdbus-1 through
        # libdbus-sys. ROWPLAY_KEYRING_TESTS stays unset: CI has no Secret
        # Service, so those tests skip and only the in-memory store is used.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - run: cargo check -p rowplay-core -p rowplay-platform -p rowplay-viewmodel -p rowplay-fixtures --all-targets

  app:
    name: App (${{ matrix.os }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
        include:
          # aqt 3.3.0 cannot parse the Qt 6.11 Windows repository layout
          # (miurahr/aqtinstall#1007: it looks for qt6_6112/qt6_6112/Updates.xml
          # but Windows uses qt6_6112/qt6_6112_msvc2022_64/Updates.xml). The fix
          # (miurahr/aqtinstall#1000) is merged to master but unreleased, so
          # install aqt from the pinned merge commit on Windows only.
          - os: windows-2025
            aqt-source: git+https://github.com/miurahr/aqtinstall@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          # aqt 3.3.0 is confirmed to install Qt 6.11.2 with its newer
          # repository layout on Linux/macOS; older aqt releases may not.
          aqtversion: '==3.3.*'
          aqtsource: ${{ matrix.aqt-source }}
          modules: 'qtquick3d qtshadertools qtquicktimeline qtgraphs'
          cache: true
      - name: Linux GL and X11 runtime for the headless smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libfontconfig1 \
            libdbus-1-dev pkg-config
      - name: Toolchain report
        shell: bash
        run: |
          rustc --version
          cargo --version
          qmake -query QT_VERSION
          # The replay scene is generated by balsam at build time; a missing
          # or different-version balsam must be visible at a glance.
          balsam --version || echo "balsam not found on PATH"
      - name: Build app
        run: cargo build -p rowplay-app
      - name: Clippy app
        run: cargo clippy -p rowplay-app --all-targets -- -D warnings
      - name: Headless smoke screenshot and runtime-error gate (Xvfb + Mesa)
        if: runner.os == 'Linux'
        env:
          ROWPLAY_QT_SMOKE: '1'
          ROWPLAY_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          # The gate walk saves per-screen PNGs (dashboard, settings, detail)
          # next to the smoke screenshot.
          ROWPLAY_SMOKE_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts
          # Also capture the twelve phase shots (catch/mid-drive/finish/
          # mid-recovery × 3 sports) as the visual phase baseline, plus their
          # torso-and-hands close-up twins. This runs in CI because
          # grabToImage on macOS/Metal returns the Quick 3D viewport black
          # (the sidebar still satisfies assert_rendered, so a black viewport
          # is invisible locally); under Xvfb+Mesa the captures carry the real
          # scene. The twins exercise the close-up framing fixed in #25 — its
          # whole purpose is judging wrist detail, which the wide shots cannot
          # resolve.
          ROWPLAY_PHASE_SHOTS: '1'
          ROWPLAY_PHASE_CLOSEUPS: '1'
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: opengl
          LIBGL_ALWAYS_SOFTWARE: '1'
          LANG: C.UTF-8
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p rowplay-app -- --nocapture
      - name: Smoke test binary starts (no display)
        if: runner.os != 'Linux'
        env:
          # The linked binary references Qt as @rpath/QtCore.framework/… but no
          # LC_RPATH is emitted (docs/qt-bridges-notes.md note 10); let dyld
          # fall back to the installed frameworks.
          DYLD_FALLBACK_FRAMEWORK_PATH: ${{ env.QT_ROOT_DIR }}/lib
        run: cargo test -p rowplay-app
      - name: Upload smoke and shell screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            artifacts/smoke.png
            artifacts/dashboard.png
            artifacts/settings.png
            artifacts/detail.png
            artifacts/detail-full.png
            artifacts/replay-row.png
            artifacts/replay-ski.png
            artifacts/replay-bike.png
            artifacts/phase-*.png
          if-no-files-found: error
      - name: Upload step-529 straddle captures
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: step529-straddle
          path: |
            artifacts/step529-cyc-0262.png
            artifacts/step529-cyc-0266.png
          if-no-files-found: error
