version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # These refs select the deliberately synchronized Rust toolchains, including MSRV.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
